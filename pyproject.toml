[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "yatouv8"
version = "0.1.0"
description = "Evidence-driven Chrome-conformant V8 host"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "yatouv8 contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[tool.maturin]
manifest-path = "crates/yatou-py/Cargo.toml"
python-source = "python"
module-name = "yatouv8._native"
features = ["extension-module", "v8-runtime"]
