[workspace]
members = [
    "crates/yatou-schema",
    "crates/yatou-core",
    "crates/yatou-surface",
    "crates/yatou-harness",
    "crates/yatou-py",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dagongdeyatou/yatouv8"

[workspace.dependencies]
base64 = "=0.22.1"
pyo3 = { version = "=0.29.2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
thiserror = "=2.0.19"
v8 = "=150.4.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
