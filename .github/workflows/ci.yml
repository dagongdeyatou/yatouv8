name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-matrix:
    runs-on: ubuntu-24.04
    outputs:
      windows_build: ${{ steps.generate.outputs.windows_build }}
      windows_test: ${{ steps.generate.outputs.windows_test }}
      macos_build: ${{ steps.generate.outputs.macos_build }}
      linux_build: ${{ steps.generate.outputs.linux_build }}
      linux_test: ${{ steps.generate.outputs.linux_test }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: generate
        name: Generate canonical native wheel matrices
        shell: bash
        run: python tools/build/wheel_matrix.py github-output >> "${GITHUB_OUTPUT}"
      - name: Validate 8 targets and 40 wheels
        run: python tools/build/wheel_matrix.py validate

  contracts:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/chrome-collector/requirements.txt
      - shell: pwsh
        run: ./scripts/check.ps1

  windows-v8-wheel:
    needs: [wheel-matrix, contracts]
    runs-on: ${{ matrix.build_runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.windows_build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: x64
      - run: python -m pip install maturin==1.14.1 websocket-client==1.9.0
      - name: Build ${{ matrix.id }} CPython ${{ matrix.python_version }} wheel
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          ./scripts/build-wheel.ps1 `
            -TargetId '${{ matrix.id }}' `
            -PythonExecutable $python `
            -MaturinPythonExecutable $python
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.wheel_artifact_name }}
          path: dist/*.whl
          if-no-files-found: error

  windows-wheel-install:
    needs: [wheel-matrix, windows-v8-wheel]
    runs-on: ${{ matrix.test_runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.windows_test) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel_artifact_name }}
          path: dist
      - name: Verify wheel before installation
        run: >-
          python tools/build/wheel_matrix.py verify-dist
          --target ${{ matrix.id }} --dist dist
          --python-version ${{ matrix.python_version }}
      - name: Install matching wheel without a compiler
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --no-index --no-deps --find-links dist yatouv8==0.1.0
      - name: Run installed-wheel tests
        run: python -m unittest discover -s python/tests -v
      - name: Run native V8 smoke
        run: >-
          python -c "import yatouv8;
          assert yatouv8.v8_smoke_value() == '42';
          r = yatouv8.Runtime();
          assert r.eval('21 * 2') == 42;
          r.close()"

  macos-v8-wheels:
    needs: [wheel-matrix, contracts]
    runs-on: ${{ matrix.build_runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.macos_build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}
      # setup-python accepts one runtime per invocation.  Keep all five tool
      # cache entries on PATH so maturin can build the complete ABI set while
      # compiling V8 only once per macOS architecture.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python_architecture }}
      - run: python3.13 -m pip install maturin==1.14.1 websocket-client==1.9.0
      - name: Build and test ${{ matrix.id }} CPython 3.10-3.14 wheels
        shell: bash
        run: bash scripts/build-wheel-macos.sh '${{ matrix.id }}' dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.whl
          if-no-files-found: error

  linux-v8-wheels:
    needs: [wheel-matrix, contracts]
    runs-on: ${{ matrix.build_runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.linux_build) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.id }} CPython 3.10-3.14 wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.97.1
          target: ${{ matrix.rust_target }}
          manylinux: ${{ matrix.maturin_manylinux }}
          container: ${{ matrix.build_container }}
          before-script-linux: |
            export YATOU_WHEEL_TARGET='${{ matrix.id }}'
            source scripts/prepare-linux.sh
          sccache: true
          args: >-
            --release --locked --auditwheel repair --compatibility pypi --out dist
            -i python3.10 python3.11 python3.12 python3.13 python3.14
      - name: Verify wheel payloads, tags, and complete ABI set
        run: >-
          python tools/build/wheel_matrix.py verify-dist
          --target ${{ matrix.id }} --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.whl
          if-no-files-found: error

  linux-wheel-install:
    needs: [wheel-matrix, linux-v8-wheels]
    runs-on: ${{ matrix.test_runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.linux_test) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: dist
      - name: Install and run in native ${{ matrix.platform_tag }} container
        shell: bash
        run: |
          docker run --rm \
            --volume '${{ github.workspace }}:/io' \
            --workdir /io \
            '${{ matrix.test_container }}' \
            bash scripts/test-wheel-linux.sh \
              '${{ matrix.id }}' '${{ matrix.python_version }}' dist
